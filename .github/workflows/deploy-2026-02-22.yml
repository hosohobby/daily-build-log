name: Deploy 2026-02-22 App

on:
  push:
    branches:
      - main
    paths:
      - 'daily-build/code/2026-02-22/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/530643963088/locations/global/workloadIdentityPools/github-pool/providers/github
          service_account: deploy-to-firebase@fir-eb3e1.iam.gserviceaccount.com

      - name: Install deps
        working-directory: daily-build/code/2026-02-22
        run: npm ci

      - name: Build
        working-directory: daily-build/code/2026-02-22
        run: npm run build
        env:
          VITE_WEATHER_API_KEY: ${{ secrets.VITE_WEATHER_API_KEY }}

      - name: Deploy to Firebase Hosting (keyless)
        working-directory: daily-build/code/2026-02-22
        run: npx -y firebase-tools@latest deploy --only hosting --project fir-eb3e1 --non-interactive
